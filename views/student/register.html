<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create An Account — GEMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" href="../../public/images/OVPERI-white.png" />
  <link rel="stylesheet" href="../../public/css/gems.css" />
  <link rel="stylesheet" href="../../public/css/register.css" />
</head>
<body>

<!-- ============================================== -->
<!-- REGISTRATION MODAL OVERLAY BACKGROUND          -->
<!-- ============================================== -->
<div class="login-bg" id="auth-modal" onclick="closeAuthModal(event)">

  <!-- auth-container is centered but allowed to scroll if it exceeds screen height -->
  <div class="auth-container" id="auth-container" onclick="event.stopPropagation()">
    <div class="card">

      <!-- Close Button ✕ -->
      <button class="modal-close-btn" onclick="closeAuthModal(event, true)">✕</button>

      <!-- Shared Brand Header Symbol -->
      <div class="brand-logo">
        <img src="../../public/images/OVPERI-white.png" alt="OVPERI Logo" class="brand-logo-img">
      </div>

      <!-- REGISTRATION VIEW -->
      <div id="register-view" class="view active">
        <h2>Create An Account</h2>
        <p class="subtext">Register your academic profile in GEMS</p>

        <form id="register-form">

          <!-- SECTION 1: Account Credentials -->
          <div class="section-heading">Account Credentials</div>
          <div class="form-group">
            <label class="form-label" for="register-email">DLSU Email Address</label>
            <input id="register-email" name="email" type="email" class="mock-field" autocomplete="email" placeholder="lastname_firstname@dlsu.edu.ph" required>
          </div>
          <div class="grid-2">
            <div class="form-group">
              <label class="form-label" for="register-password">Password</label>
              <input id="register-password" name="password" type="password" class="mock-field" autocomplete="new-password" minlength="8" placeholder="••••••••" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="register-confirm-password">Confirm Password</label>
              <input id="register-confirm-password" name="confirmPassword" type="password" class="mock-field" autocomplete="new-password" minlength="8" placeholder="••••••••" required>
            </div>
          </div>

          <!-- SECTION 2: Personal Information -->
          <div class="section-heading">Personal Information</div>
          <div class="form-group">
            <label class="form-label" for="register-name">Full Name</label>
            <input id="register-name" name="name" type="text" class="mock-field" autocomplete="name" placeholder="e.g. Juan Dela Cruz" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="register-phone">Phone Number</label>
            <input id="register-phone" name="phone" type="tel" class="mock-field" autocomplete="tel" placeholder="+63 9XX XXX XXXX" required>
          </div>
          <div class="grid-2">
            <div class="form-group">
              <label class="form-label" for="register-gender">Gender</label>
              <select id="register-gender" name="gender" class="mock-field" required>
                <option value="" disabled selected>Select Gender</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Other</option>
                <option value="prefer-not">Prefer not to say</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label" for="register-birthdate">Date of Birth</label>
              <input id="register-birthdate" name="birthdate" type="date" class="mock-field" required>
            </div>
          </div>

          <!-- SECTION 3: Academic Details -->
          <div class="section-heading">Academic Details</div>
          <div class="grid-2">
            <div class="form-group">
              <label class="form-label" for="register-student-id">Student ID Number</label>
              <input id="register-student-id" name="studentId" type="text" class="mock-field mono" placeholder="12306533" maxlength="8" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="register-college">College</label>
              <select id="register-college" name="college" class="mock-field" required>
                <option value="" disabled selected>Select College</option>
                <option value="CCS">CCS</option>
                <option value="CLA">CLA</option>
                <option value="GCOE">GCOE</option>
                <option value="RVRCOB">RVRCOB</option>
              </select>
            </div>
          </div>

          <div class="grid-2">
            <div class="form-group">
              <label class="form-label" for="register-enrollment-status">Enrollment Status</label>
              <select id="register-enrollment-status" name="enrollmentStatus" class="mock-field" required>
                <option value="" disabled selected>Select Status</option>
                <option value="Full-time">Full-time</option>
                <option value="Part-time">Part-time</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label" for="register-major">Current Major / Program</label>
              <input id="register-major" name="major" type="text" class="mock-field" placeholder="e.g. BSCS-ST" required>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="register-grad-term">Expected Graduation Term</label>
            <input id="register-grad-term" name="graduatingTerm" type="text" class="mock-field" placeholder="e.g. Term 3, AY 2025-2026" required>
          </div>

          <div id="register-message" class="auth-message" role="alert" aria-live="polite" hidden></div>

          <!-- Submit Action -->
          <button type="submit" class="btn btn-primary" style="margin-top: 2rem;">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path stroke="none" d="M0 0h24v24H0z" fill="none" />
              <path d="M5 12l5 5l10 -10" />
            </svg> Complete Registration
          </button>
        </form>

        <!-- redirects back to the login modal file -->
        <div class="toggle-link">
          Already have an account? <a href="login.html">Sign in</a>
        </div>
      </div>

    </div>
  </div>
</div>

<script>
  function openAuthModal() {
    document.getElementById('auth-modal').classList.add('active');
    document.body.style.overflow = 'hidden';
  }

  function closeAuthModal(event, force = false) {
    if (force || event.target === document.getElementById('auth-modal')) {
      document.getElementById('auth-modal').classList.remove('active');
      document.body.style.overflow = 'auto';
    }
  }

  window.onload = function() {
    openAuthModal();
  };
</script>
<script src="../../public/js/auth-pages.js"></script>
</body>
</html>
