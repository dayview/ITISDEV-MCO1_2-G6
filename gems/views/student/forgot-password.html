<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — GEMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../public/css/gems.css" />
  <link rel="stylesheet" href="../../public/css/login.css" />
</head>
<body>

<!-- ============================================== -->
<!-- FORGOT PASSWORD MODAL OVERLAY BACKGROUND       -->
<!-- ============================================== -->
<div class="login-bg" id="auth-modal" onclick="closeAuthModal(event)">
  
  <div class="auth-container" id="auth-container" onclick="event.stopPropagation()">
    <div class="card">
      
      <!-- Close Button ✕ -->
      <button class="modal-close-btn" onclick="closeAuthModal(event, true)">✕</button>
      
      <!-- Shared Brand Header Symbol -->
      <div class="brand-logo">
        <img src="../../public/images/OVPERI-white.png" alt="OVPERI Logo" class="brand-logo-img">
      </div>

      <!-- FORGOT PASSWORD VIEW -->
      <div id="forgot-password-view" class="view active">
        <h2>Reset Password</h2>
        <p class="subtext" style="line-height: 1.5; margin-bottom: 2rem;">
          Enter your registered DLSU email address and we'll send you a secure link to reset your password.
        </p>

        <form action="login.html" onsubmit="event.preventDefault();">
          
          <div class="form-group">
            <label class="form-label">DLSU Email Address</label>
            <input type="email" class="mock-field" placeholder="lastname_firstname@dlsu.edu.ph" required>
          </div>

          <button type="submit" class="btn btn-primary" style="margin-top: 1.5rem;">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
              <path d="M10 14l11 -11" />
              <path d="M21 3l-6.5 18a.55 .55 0 0 1 -1 0l-3.5 -7l-7 -3.5a.55 .55 0 0 1 0 -1l18 -6.5" />
            </svg> 
            Send Reset Link
          </button>

        </form>

        <!-- redirects back to login -->
        <div class="toggle-link" style="margin-top: 2rem;">
          Remember your password? <a href="#" onclick="event.preventDefault(); if (window.loadAuthContent) { window.loadAuthContent('login.html'); } else { window.location.href = 'login.html'; }">Back to login</a>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  function openAuthModal() {
    document.getElementById('auth-modal').classList.add('active');
    document.body.style.overflow = 'hidden';
  }

  function closeAuthModal(event, force = false) {
    if (force || event.target === document.getElementById('auth-modal')) {
      document.getElementById('auth-modal').classList.remove('active');
      document.body.style.overflow = 'auto';
    }
  }

  window.onload = function() {
    openAuthModal();
  };
</script>
</body>
</html>
