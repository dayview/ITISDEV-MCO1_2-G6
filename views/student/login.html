<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in — GEMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" href="../../public/images/OVPERI-white.png" />
  <link rel="stylesheet" href="../../public/css/gems.css" />
  <link rel="stylesheet" href="../../public/css/login.css" />
</head>
<body>

<!-- ============================================== -->
<!-- LOGIN MODAL OVERLAY BACKGROUND                 -->
<!-- ============================================== -->
<div class="login-bg active" id="auth-modal">

  <div class="auth-container" id="auth-container">
    <div class="card">
      <div class="brand-logo" aria-hidden="true">
        <img src="../../public/images/OVPERI-white.png" alt="OVPERI Logo" class="brand-logo-img">
      </div>

      <div id="auth-content">
        <div id="login-view" class="view active">
          <header class="login-brand">
            <h1>GEMS</h1>
            <p>Global Mobility &amp; Exchange Management System</p>
          </header>

          <div class="section-divider" aria-label="Login">
            <span></span>
            <strong>
              <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="2"/></svg>
              Login
            </strong>
            <span></span>
          </div>

          <form id="login-form">
            <div class="form-group">
              <label class="form-label" for="login-email">Email Address</label>
              <div class="input-wrap">
                <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="m3 7 9 6 9-6" fill="none" stroke="currentColor" stroke-width="2"/></svg>
                <input id="login-email" name="email" type="email" class="mock-field" autocomplete="email" placeholder="surname_firstname@dlsu.edu.ph" required>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="login-password">Password</label>
              <div class="input-wrap input-wrap--password">
                <input id="login-password" name="password" type="password" class="mock-field" autocomplete="current-password" placeholder="••••••••" required>
                <button type="button" class="password-toggle" id="password-toggle" aria-label="Show password" aria-pressed="false">
                  <svg class="eye-open" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/></svg>
                  <svg class="eye-closed" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="m3 3 18 18M10.6 6.2A10.7 10.7 0 0 1 12 6c6.5 0 10 6 10 6a17 17 0 0 1-2.1 2.8M6.6 6.6C3.6 8.4 2 12 2 12s3.5 6 10 6c1.7 0 3.2-.4 4.4-1" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2" fill="none" stroke="currentColor" stroke-width="2"/></svg>
                </button>
              </div>
            </div>

            <div class="keep-signed-wrapper">
              <label class="keep-signed-label">
                <input type="checkbox" class="keep-signed-checkbox" checked>
                Keep me signed in
              </label>
              <a href="forgot-password.html" class="forgot-password">Forgot password?</a>
            </div>

            <div id="login-message" class="auth-message" role="alert" aria-live="polite" hidden></div>

            <button type="submit" class="btn btn-primary">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                <path d="M15 8v-2a2 2 0 0 0 -2 -2h-7a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h7a2 2 0 0 0 2 -2v-2" />
                <path d="M21 12h-13l3 -3" />
                <path d="M11 15l-3 -3" />
              </svg> Log in
            </button>

            <div class="or-row"><div class="or-line"></div><span class="or-text">or</span><div class="or-line"></div></div>

            <button type="button" class="btn btn-google" id="google-login" aria-describedby="login-message">
              <svg viewBox="0 0 24 24" width="16" height="16"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
              Continue with Google
            </button>
          </form>

          <div class="toggle-link">
            New to GEMS? <a href="register.html">Make an account</a>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<script>
  const passwordToggle = document.getElementById('password-toggle');
  const passwordInput = document.getElementById('login-password');
  passwordToggle.addEventListener('click', function() {
    const showing = passwordInput.type === 'text';
    passwordInput.type = showing ? 'password' : 'text';
    passwordToggle.setAttribute('aria-pressed', String(!showing));
    passwordToggle.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
  });
</script>
<script src="../../public/js/auth-pages.js"></script>
</body>
</html>
