<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in — GEMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../public/css/gems.css" />
  <link rel="stylesheet" href="../../public/css/login.css" />
</head>
<body>

<!-- ============================================== -->
<!-- LOGIN MODAL OVERLAY BACKGROUND                 -->
<!-- ============================================== -->
<div class="login-bg" id="auth-modal" onclick="closeAuthModal(event)">
  
  <div class="auth-container" id="auth-container" onclick="event.stopPropagation()">
    <div class="card">
      
      <!-- Close Button ✕ -->
      <button class="modal-close-btn" onclick="closeAuthModal(event, true)">✕</button>
      
      <!-- Shared Brand Header Symbol -->
      <div class="brand-logo">
        <img src="../../public/images/OVPERI-white.png" alt="OVPERI Logo" class="brand-logo-img">
      </div>

      <!-- LOGIN VIEW -->
      <div id="auth-content">
        <div id="login-view" class="view active">
          <h2>Welcome to GEMS</h2>
          <p class="subtext">Sign in to your GEMS account</p>

          <form action="dashboard.html" onsubmit="event.preventDefault();">
            <div class="form-group">
              <label class="form-label">DLSU Email Address</label>
              <input type="email" class="mock-field" placeholder="lastname_firstname@dlsu.edu.ph" required>
            </div>
            
            <div class="form-group">
              <label class="form-label">Password</label>
              <input type="password" class="mock-field" placeholder="••••••••" required>
            </div>

            <div class="keep-signed-wrapper">
              <label class="keep-signed-label">
                <input type="checkbox" class="keep-signed-checkbox" checked>
                Keep me signed in
              </label>
              <a href="#" class="forgot-password" onclick="event.preventDefault(); loadAuthContent('forgot-password.html');">Forgot password?</a>
            </div>

            <button type="submit" class="btn btn-primary">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                <path d="M15 8v-2a2 2 0 0 0 -2 -2h-7a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h7a2 2 0 0 0 2 -2v-2" />
                <path d="M21 12h-13l3 -3" />
                <path d="M11 15l-3 -3" />
              </svg> Log in
            </button>

            <div class="or-row"><div class="or-line"></div><span class="or-text">or</span><div class="or-line"></div></div>
            
            <button type="button" class="btn btn-google">
              <svg viewBox="0 0 24 24" width="16" height="16"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
              Continue with Google
            </button>
          </form>

          <div class="toggle-link">
            New to GEMS? <a href="#" onclick="event.preventDefault(); loadAuthContent('register.html');">Make an account</a>
          </div>
        </div>
      </div>

      <iframe id="auth-frame" title="Authentication content" style="display:none; width:100%; min-height:420px; border:0; background:#fff;"></iframe>
    </div>
  </div>
</div>

<script>
  function openAuthModal() {
    document.getElementById('auth-modal').classList.add('active');
    document.body.style.overflow = 'hidden';
  }

  function closeAuthModal(event, force = false) {
    if (force || event.target === document.getElementById('auth-modal')) {
      document.getElementById('auth-modal').classList.remove('active');
      document.body.style.overflow = 'auto';
      const frame = document.getElementById('auth-frame');
      if (frame) {
        frame.style.display = 'none';
        frame.src = 'about:blank';
      }
      const content = document.getElementById('auth-content');
      if (content) {
        content.style.display = 'block';
      }
    }
  }

  function loadAuthContent(page) {
    const content = document.getElementById('auth-content');
    const frame = document.getElementById('auth-frame');

    if (!content || !frame) return;

    if (page === 'login.html') {
      content.style.display = 'block';
      frame.style.display = 'none';
      frame.src = 'about:blank';
      return;
    }

    content.style.display = 'none';
    frame.style.display = 'block';
    frame.src = page;
  }

  window.onload = function() {
    openAuthModal();
  };

  window.loadAuthContent = loadAuthContent;
</script>
</body>
</html>
