<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in — GEMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../public/css/gems.css" />
  <link rel="stylesheet" href="../../public/css/login.css" />
</head>
<body>

<div class="app-wrapper">

  <!-- =====================================================================
       PROTO BAR
       ===================================================================== -->
  <nav class="student-topnav" aria-label="Student navigation">
    <a href="http://127.0.0.1:5500/gems/views/student/dashboard.html" class="student-topnav__brand">
      <div class="student-topnav__logo">
        <img src="../../public/images/OVPERI-white.png" alt="OVPERI" class="student-topnav__logo-img">
      </div>
      <span class="student-topnav__title">GEMS</span>
    </a>

    <div class="student-topnav__links">
      <a class="student-topnav__link" href="http://127.0.0.1:5500/gems/views/student/catalog.html">
        <div class="student-topnav__link-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20"/><path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v18"/></svg>
        </div>
        <div class="student-topnav__link-label">Catalog</div>
      </a>

      <a class="student-topnav__link" href="http://127.0.0.1:5500/gems/views/student/documents.html">
        <div class="student-topnav__link-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
        </div>
        <div class="student-topnav__link-label">Documents</div>
      </a>

      <a class="student-topnav__link" href="http://127.0.0.1:5500/gems/views/student/applications.html">
        <div class="student-topnav__link-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5l4 4L8 20l-4 1 1-4L16.5 3.5z"/></svg>
        </div>
        <div class="student-topnav__link-label">My Applications</div>
      </a>

      <a class="student-topnav__link" href="http://127.0.0.1:5500/gems/views/student/profile.html">
        <div class="student-topnav__link-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </div>
        <div class="student-topnav__link-label">Account</div>
      </a>
    </div>
    <div class="student-topnav__actions"></div>
  </nav>

  <!-- =====================================================================
       LOGIN MODAL OVERLAY
       ===================================================================== -->
  <div class="login-bg">

    <div class="login-card">

      <!-- Header -->
      <div class="login-card__head">
        <div class="login-card__brand">
          <div class="login-card__brand-left">
            <div class="login-card__logo">G</div>
            <span class="login-card__title">Welcome back</span>
          </div>
          <a href="dashboard.html"
             style="background:rgba(255,255,255,.15);border:none;border-radius:8px;width:30px;height:30px;font-size:15px;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;text-decoration:none;">
            ✕
          </a>
        </div>
        <div class="login-card__sub">Sign in to your GEMS account.</div>
      </div>

      <!-- Body -->
      <div class="login-card__body">

        <div id="login-error" style="display:none;color:#f87171;font-size:13px;margin-bottom:8px;"></div>

        <div class="field">
          <div class="field__label">DLSU Email Address</div>
          <input id="login-email" type="email" placeholder="lastname_firstname@dlsu.edu.ph" />
        </div>

        <div class="field">
          <div class="field__row">
            <div class="field__label" style="margin-bottom:0;">Password</div>
            <a href="#" class="field__forgot">Forgot password?</a>
          </div>
          <input id="login-password" type="password" placeholder="••••••••" />
        </div>

        <label class="keep-signed">
          <div class="keep-signed__box">✓</div>
          Keep me signed in
        </label>

        <button id="btn-login" class="btn-login">Log in</button>

        <div class="login-footer">
          New to GEMS? <a href="register.html">Create an account</a>
        </div>

      </div>
    </div>

  </div><!-- /login-bg -->

</div><!-- /app-wrapper -->

<script>
  document.getElementById('btn-login').addEventListener('click', async () => {
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    const errorEl = document.getElementById('login-error');

    errorEl.style.display = 'none';
    errorEl.textContent = '';

    if (!email || !password) {
      errorEl.textContent = 'Please enter your email and password.';
      errorEl.style.display = 'block';
      return;
    }

    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }),
      });

      const data = await res.json();

      if (!res.ok) {
        errorEl.textContent = data.message || 'Login failed.';
        errorEl.style.display = 'block';
        return;
      }

      const role = data.user?.role;
      if (role === 'OVPERI_Admin' || role === 'System_Admin') {
        window.location.href = '/admin/dashboard.html';
      } else {
        window.location.href = '/dashboard.html';
      }
    } catch {
      errorEl.textContent = 'Network error. Please try again.';
      errorEl.style.display = 'block';
    }
  });

  // Allow Enter key to submit
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('btn-login').click();
  });
</script>
</body>
</html>
